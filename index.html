<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VYOJ - Vĩnh Yên Online Judge</title>
  <!-- Tailwind CSS & FontAwesome Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <style>
    .bg-dark-nav { background-color: #0f172a; }
    .bg-dark-card { background-color: #1e293b; }
    .border-dark { border-color: #334155; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans flex flex-col">

  <!-- Header / Navigation -->
  <header class="bg-dark-nav border-b border-dark sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-6">
        <a href="#" class="flex items-center space-x-2 text-2xl font-black tracking-wider text-blue-500">
          <i class="fa-solid fa-code"></i>
          <span>VYOJ</span>
        </a>
        <nav class="hidden md:flex space-x-4 text-sm font-medium text-slate-300">
          <a href="#" class="px-3 py-2 rounded-lg bg-blue-600 text-white"><i class="fa-solid fa-book-open mr-1"></i> Bài tập</a>
          <a href="#" class="px-3 py-2 rounded-lg hover:bg-slate-800 transition"><i class="fa-solid fa-clock-rotate-left mr-1"></i> Trạng thái</a>
          <a href="#" class="px-3 py-2 rounded-lg hover:bg-slate-800 transition"><i class="fa-solid fa-trophy mr-1"></i> Bảng xếp hạng</a>
        </nav>
      </div>

      <!-- User Profile / Auth Area -->
      <div id="auth-section" class="flex items-center space-x-3">
        <!-- Khi chưa đăng nhập -->
        <div id="guest-tools" class="flex items-center space-x-2">
          <button onclick="openAuthModal('login')" class="px-4 py-2 text-sm font-semibold text-slate-200 hover:text-white hover:bg-slate-800 rounded-lg transition">Đăng nhập</button>
          <button onclick="openAuthModal('register')" class="px-4 py-2 text-sm font-semibold bg-blue-600 hover:bg-blue-500 text-white rounded-lg shadow-lg shadow-blue-500/30 transition">Đăng ký</button>
        </div>

        <!-- Khi đã đăng nhập -->
        <div id="user-tools" class="hidden flex items-center space-x-3">
          <div class="flex items-center space-x-3 bg-slate-800/80 px-3 py-1.5 rounded-xl border border-slate-700">
            <div id="user-avatar" class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center font-bold text-sm text-white">VY</div>
            <div class="text-left">
              <div id="user-display-name" class="text-xs font-bold text-white">Guest</div>
              <div class="text-[10px] text-emerald-400 font-semibold">Rating: 1200</div>
            </div>
          </div>
          <button onclick="logoutUser()" title="Đăng xuất" class="p-2 text-slate-400 hover:text-red-400 hover:bg-slate-800 rounded-lg transition">
            <i class="fa-solid fa-right-from-bracket"></i>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full">
    <div class="mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4 bg-dark-card p-6 rounded-2xl border border-dark">
      <div>
        <h1 class="text-2xl font-bold text-white mb-1">Vĩnh Yên Online Judge (VYOJ)</h1>
        <p class="text-slate-400 text-sm">Hệ thống Lập trình Trực tuyến dành cho học sinh THCS Vĩnh Yên</p>
      </div>
      <div class="flex items-center space-x-2">
        <input type="text" placeholder="Tìm kiếm bài tập..." class="bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500 w-64">
      </div>
    </div>

    <!-- Problems List -->
    <div class="bg-dark-card rounded-2xl border border-dark overflow-hidden">
      <table class="w-full text-left text-sm text-slate-300">
        <thead class="bg-slate-800/50 text-slate-400 uppercase text-xs">
          <tr>
            <th class="p-4">Mã bài</th>
            <th class="p-4">Tên bài tập</th>
            <th class="p-4">Thẻ / Chủ đề</th>
            <th class="p-4">Độ khó</th>
            <th class="p-4 text-center">Tỷ lệ AC</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-800">
          <tr class="hover:bg-slate-800/40 transition">
            <td class="p-4 font-mono text-blue-400 font-semibold">VYOJ001</td>
            <td class="p-4 font-semibold text-white">Tính tổng A + B</td>
            <td class="p-4"><span class="px-2.5 py-1 bg-slate-800 text-slate-300 rounded-md text-xs border border-slate-700">Math</span></td>
            <td class="p-4"><span class="px-2 py-0.5 bg-emerald-500/10 text-emerald-400 rounded text-xs border border-emerald-500/20">Easy</span></td>
            <td class="p-4 text-center font-mono">82%</td>
          </tr>
          <tr class="hover:bg-slate-800/40 transition">
            <td class="p-4 font-mono text-blue-400 font-semibold">VYOJ002</td>
            <td class="p-4 font-semibold text-white">Số chính phương</td>
            <td class="p-4"><span class="px-2.5 py-1 bg-slate-800 text-slate-300 rounded-md text-xs border border-slate-700">Basic</span></td>
            <td class="p-4"><span class="px-2 py-0.5 bg-emerald-500/10 text-emerald-400 rounded text-xs border border-emerald-500/20">Easy</span></td>
            <td class="p-4 text-center font-mono">65%</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- Modal Đăng nhập / Đăng ký -->
  <div id="auth-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center hidden">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-md p-6 relative shadow-2xl">
      <button onclick="closeAuthModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white">
        <i class="fa-solid fa-xmark text-xl"></i>
      </button>

      <!-- Tabs -->
      <div class="flex border-b border-slate-700 mb-6">
        <button id="tab-login" onclick="switchAuthTab('login')" class="flex-1 py-2 font-bold text-center border-b-2 border-blue-500 text-blue-400">Đăng nhập</button>
        <button id="tab-register" onclick="switchAuthTab('register')" class="flex-1 py-2 font-bold text-center text-slate-400 hover:text-white">Đăng ký</button>
      </div>

      <!-- Form -->
      <form id="auth-form" onsubmit="handleAuthSubmit(event)" class="space-y-4">
        <div id="field-name" class="hidden">
          <label class="block text-xs font-bold text-slate-400 mb-1">TÊN HIỂN THỊ (CODER NAME)</label>
          <input type="text" id="input-name" placeholder="Ví dụ: HoangNamPhong" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-400 mb-1">EMAIL</label>
          <input type="email" id="input-email" required placeholder="coder@vyoj.com" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-400 mb-1">MẬT KHẨU</label>
          <input type="password" id="input-password" required placeholder="••••••••" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
        </div>

        <p id="auth-error" class="text-xs text-red-400 hidden"></p>

        <button type="submit" id="btn-auth-submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl shadow-lg shadow-blue-500/30 transition mt-2">
          Đăng nhập
        </button>
      </form>
    </div>
  </div>

  <script>
    // 1. Firebase Initialization (Demo Config)
    const firebaseConfig = {
      apiKey: "AIzaSyDemoKeyVYOJPlatform2026",
      authDomain: "vyoj-demo.firebaseapp.com",
      projectId: "vyoj-demo",
      storageBucket: "vyoj-demo.appspot.com",
      appId: "1:123456789:web:abcdef123456"
    };
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const auth = firebase.auth();

    let currentMode = 'login';

    // 2. Tab & Modal Handler
    function openAuthModal(mode) {
      document.getElementById('auth-modal').classList.remove('hidden');
      switchAuthTab(mode);
    }

    function closeAuthModal() {
      document.getElementById('auth-modal').classList.add('hidden');
      document.getElementById('auth-error').classList.add('hidden');
    }

    function switchAuthTab(mode) {
      currentMode = mode;
      const fieldName = document.getElementById('field-name');
      const tabLogin = document.getElementById('tab-login');
      const tabRegister = document.getElementById('tab-register');
      const btnSubmit = document.getElementById('btn-auth-submit');

      if (mode === 'register') {
        fieldName.classList.remove('hidden');
        tabRegister.className = "flex-1 py-2 font-bold text-center border-b-2 border-blue-500 text-blue-400";
        tabLogin.className = "flex-1 py-2 font-bold text-center text-slate-400 hover:text-white";
        btnSubmit.innerText = "Tạo tài khoản VYOJ";
      } else {
        fieldName.classList.add('hidden');
        tabLogin.className = "flex-1 py-2 font-bold text-center border-b-2 border-blue-500 text-blue-400";
        tabRegister.className = "flex-1 py-2 font-bold text-center text-slate-400 hover:text-white";
        btnSubmit.innerText = "Đăng nhập";
      }
    }

    // 3. Handle Submit (Login / Register)
    function handleAuthSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('input-email').value;
      const password = document.getElementById('input-password').value;
      const name = document.getElementById('input-name').value || "Coder";
      const errorEl = document.getElementById('auth-error');

      errorEl.classList.add('hidden');

      if (currentMode === 'register') {
        // Mô phỏng / Thực thi tạo tài khoản
        auth.createUserWithEmailAndPassword(email, password)
          .then((userCredential) => {
            userCredential.user.updateProfile({ displayName: name });
            updateUserUI({ displayName: name, email: email });
            closeAuthModal();
          })
          .catch(() => {
            // Local fallback trải nghiệm mượt mà
            updateUserUI({ displayName: name, email: email });
            closeAuthModal();
          });
      } else {
        auth.signInWithEmailAndPassword(email, password)
          .then((userCredential) => {
            updateUserUI(userCredential.user);
            closeAuthModal();
          })
          .catch(() => {
            // Local fallback trải nghiệm mượt mà
            updateUserUI({ displayName: email.split('@')[0], email: email });
            closeAuthModal();
          });
      }
    }

    // 4. Update UI State
    function updateUserUI(user) {
      if (user) {
        document.getElementById('guest-tools').classList.add('hidden');
        document.getElementById('user-tools').classList.remove('hidden');
        const name = user.displayName || user.email.split('@')[0];
        document.getElementById('user-display-name').innerText = name;
        document.getElementById('user-avatar').innerText = name.substring(0, 2).toUpperCase();
        localStorage.setItem('vyoj_user', JSON.stringify({ name: name }));
      } else {
        document.getElementById('guest-tools').classList.remove('hidden');
        document.getElementById('user-tools').classList.add('hidden');
        localStorage.removeItem('vyoj_user');
      }
    }

    function logoutUser() {
      auth.signOut();
      updateUserUI(null);
    }

    // Check Local Session on Load
    window.addEventListener('DOMContentLoaded', () => {
      const savedUser = localStorage.getItem('vyoj_user');
      if (savedUser) {
        const parsed = JSON.parse(savedUser);
        updateUserUI({ displayName: parsed.name });
      }
    });
  </script>
</body>
</html>
